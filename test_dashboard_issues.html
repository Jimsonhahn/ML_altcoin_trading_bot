<!DOCTYPE html>
<html>
<head>
    <title>Dashboard Issues Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .success { background: #d4edda; border-color: #c3e6cb; }
        .error { background: #f8d7da; border-color: #f5c6cb; }
        button { padding: 10px 20px; margin: 5px; }
        pre { background: #f8f9fa; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🔧 Dashboard Issues Debugging</h1>
    
    <div class="test" id="test1">
        <h3>Test 1: Strategy Loading</h3>
        <button onclick="testStrategies()">Test Strategy API</button>
        <div id="strategies-result"></div>
    </div>
    
    <div class="test" id="test2">
        <h3>Test 2: Performance Data</h3>
        <button onclick="testPerformance()">Test Performance API</button>
        <div id="performance-result"></div>
    </div>
    
    <div class="test" id="test3">
        <h3>Test 3: Mock WebSocket</h3>
        <button onclick="testWebSocket()">Simulate WebSocket</button>
        <div id="websocket-result"></div>
    </div>

    <script>
        const API_URL = 'http://localhost:5001';
        
        async function testStrategies() {
            const resultDiv = document.getElementById('strategies-result');
            const testDiv = document.getElementById('test1');
            
            try {
                resultDiv.innerHTML = '<p>🔄 Loading strategies...</p>';
                
                const response = await fetch(`${API_URL}/api/v1/strategies/list`, {
                    headers: { 'Content-Type': 'application/json' }
                });
                
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                const strategies = data.strategies || [];
                
                const superLazy = strategies.find(s => s.name === 'super_lazy_billionaire');
                
                if (superLazy) {
                    testDiv.className = 'test success';
                    resultDiv.innerHTML = `
                        <h4>✅ SuperLazyBillionaire Found!</h4>
                        <p><strong>Name:</strong> ${superLazy.name}</p>
                        <p><strong>Risk Level:</strong> ${superLazy.risk_level}</p>
                        <p><strong>Timeframes:</strong> ${superLazy.timeframes.join(', ')}</p>
                        <p><strong>Total Strategies:</strong> ${strategies.length}</p>
                        <details>
                            <summary>Full Strategy Data</summary>
                            <pre>${JSON.stringify(superLazy, null, 2)}</pre>
                        </details>
                    `;
                } else {
                    testDiv.className = 'test error';
                    resultDiv.innerHTML = `
                        <h4>❌ SuperLazyBillionaire NOT found</h4>
                        <p>Available strategies: ${strategies.map(s => s.name).join(', ')}</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                }
                
            } catch (error) {
                testDiv.className = 'test error';
                resultDiv.innerHTML = `<h4>❌ API Error: ${error.message}</h4>`;
            }
        }
        
        async function testPerformance() {
            const resultDiv = document.getElementById('performance-result');
            const testDiv = document.getElementById('test2');
            
            try {
                resultDiv.innerHTML = '<p>🔄 Loading performance data...</p>';
                
                const response = await fetch(`${API_URL}/api/v1/trading/performance?period=day`, {
                    headers: { 'Content-Type': 'application/json' }
                });
                
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                
                if (data.history && data.history.length > 0) {
                    testDiv.className = 'test success';
                    resultDiv.innerHTML = `
                        <h4>✅ Performance Data Loaded!</h4>
                        <p><strong>Total PnL:</strong> $${data.total_pnl}</p>
                        <p><strong>Today PnL:</strong> $${data.today_pnl}</p>
                        <p><strong>History Points:</strong> ${data.history.length}</p>
                        <p><strong>Latest History:</strong> ${data.history[data.history.length-1].date}</p>
                        <details>
                            <summary>Sample History Data</summary>
                            <pre>${JSON.stringify(data.history.slice(-3), null, 2)}</pre>
                        </details>
                    `;
                } else {
                    testDiv.className = 'test error';
                    resultDiv.innerHTML = `
                        <h4>❌ No History Data</h4>
                        <p>Response has no history array</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                }
                
            } catch (error) {
                testDiv.className = 'test error';
                resultDiv.innerHTML = `<h4>❌ API Error: ${error.message}</h4>`;
            }
        }
        
        function testWebSocket() {
            const resultDiv = document.getElementById('websocket-result');
            const testDiv = document.getElementById('test3');
            
            resultDiv.innerHTML = '<p>🔄 Simulating WebSocket connection...</p>';
            
            // Simulate WebSocket connection process
            setTimeout(() => {
                testDiv.className = 'test success';
                resultDiv.innerHTML = `
                    <h4>✅ WebSocket Connected (Simulated)</h4>
                    <p><strong>Status:</strong> Connected</p>
                    <p><strong>Connected At:</strong> ${new Date().toLocaleTimeString()}</p>
                    <p><strong>Type:</strong> Mock WebSocket</p>
                    <p>This simulates a successful WebSocket connection for the dashboard.</p>
                `;
            }, 1000);
        }
        
        // Auto-run tests on page load
        window.onload = function() {
            setTimeout(testStrategies, 500);
            setTimeout(testPerformance, 1000);
            setTimeout(testWebSocket, 1500);
        };
    </script>
</body>
</html>
