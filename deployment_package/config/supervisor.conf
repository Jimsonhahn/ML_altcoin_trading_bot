# Supervisor Configuration for Trading Bot Services
# Place this in /etc/supervisor/conf.d/trading-bot.conf

[group:trading-bot]
programs=trading-bot-api,intelligence-api,react-dashboard
priority=999

# Main Trading Bot API
[program:trading-bot-api]
command=/opt/trading-bot/venv/bin/python -m uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4
directory=/opt/trading-bot
user=ubuntu
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/opt/trading-bot/logs/trading-bot-api.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
environment=PATH="/opt/trading-bot/venv/bin"

# Intelligence Dashboard API
[program:intelligence-api]
command=/opt/trading-bot/venv/bin/python config/server_intelligence_api.py
directory=/opt/trading-bot
user=ubuntu
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/opt/trading-bot/logs/intelligence-api.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
environment=PATH="/opt/trading-bot/venv/bin"

# React Dashboard (for development - in production, build and serve static files)
[program:react-dashboard]
command=/usr/bin/npm start
directory=/opt/trading-bot/dashboard
user=ubuntu
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/opt/trading-bot/logs/react-dashboard.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
environment=PORT="3000",NODE_ENV="production"

# Trading Bot Background Worker (optional)
[program:trading-bot-worker]
command=/opt/trading-bot/venv/bin/python -m worker
directory=/opt/trading-bot
user=ubuntu
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/opt/trading-bot/logs/worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
environment=PATH="/opt/trading-bot/venv/bin"

# Telegram Bot (optional)
[program:telegram-bot]
command=/opt/trading-bot/venv/bin/python -m telegram_bot
directory=/opt/trading-bot
user=ubuntu
autostart=false
autorestart=true
redirect_stderr=true
stdout_logfile=/opt/trading-bot/logs/telegram-bot.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
environment=PATH="/opt/trading-bot/venv/bin"