version: '3.8'

services:
  # Revolutionary Janics Freedom Factory Trading Bot
  janics-trading-bot:
    build: .
    container_name: janics-freedom-factory
    ports:
      - "8080:8080"    # Backend API
      - "3000:3000"    # Frontend Dashboard (if served by bot)
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
      - ./backups:/app/backups
      - trading_data:/app/persistent_data
    environment:
      - MODE=paper
      - LOG_LEVEL=INFO
      - FLASK_ENV=production
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001,http://localhost:3002
      - PAPER_TRADING_BALANCE=10000
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-generate-secure-key-in-production}
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-generate-secure-key-in-production}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - trading-network

  # Optional: PostgreSQL Database for production
  postgres:
    image: postgres:13-alpine
    container_name: janics-database
    environment:
      POSTGRES_DB: janics_trading
      POSTGRES_USER: janics
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-in-production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - trading-network

  # Optional: Redis for caching and session management
  redis:
    image: redis:7-alpine
    container_name: janics-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - trading-network

  # Optional: Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: janics-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - ./dashboard/build:/usr/share/nginx/html
    depends_on:
      - janics-trading-bot
    restart: unless-stopped
    networks:
      - trading-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  trading_data:
    driver: local

networks:
  trading-network:
    driver: bridge