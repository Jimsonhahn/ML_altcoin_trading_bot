# 🚀 Nginx Configuration für Enhanced Trading Bot
# Optimiert für Windows Server Deployment

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;
    
    # Basic settings
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    
    # Rate limiting for API endpoints
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=dashboard:10m rate=5r/s;
    
    # Upstream für Trading Bot API
    upstream trading_bot_api {
        server trading_bot:8000;
        # Health check würde hier konfiguriert (nginx plus)
    }
    
    # Upstream für React Dashboard
    upstream dashboard {
        server dashboard:3000;
    }
    
    # HTTPS Redirect (wenn SSL aktiviert)
    server {
        listen 80;
        server_name 85.215.183.30 localhost;
        
        # Redirect all HTTP traffic to HTTPS (uncomment für production)
        # return 301 https://$server_name$request_uri;
        
        # For development/testing, serve directly
        location / {
            return 301 http://$server_name/dashboard$request_uri;
        }
        
        # API endpoints
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            
            proxy_pass http://trading_bot_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            # Timeout settings
            proxy_connect_timeout       60s;
            proxy_send_timeout          60s;
            proxy_read_timeout          60s;
        }
        
        # WebSocket für Real-time Updates
        location /socket.io/ {
            proxy_pass http://trading_bot_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Dashboard
        location /dashboard {
            limit_req zone=dashboard burst=10 nodelay;
            
            proxy_pass http://dashboard;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
        
        # Static files für Dashboard
        location /static/ {
            proxy_pass http://dashboard;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        # Health check
        location /health {
            proxy_pass http://trading_bot_api/api/v1/health;
            access_log off;
        }
        
        # Intelligence exports (protected)
        location /intelligence/ {
            # Basic auth oder IP restriction hier
            # allow 85.215.183.30;
            # deny all;
            
            proxy_pass http://trading_bot_api/api/v1/intelligence/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
    
    # HTTPS Server (für Production mit SSL)
    # server {
    #     listen 443 ssl http2;
    #     server_name 85.215.183.30;
    #     
    #     # SSL Configuration
    #     ssl_certificate /etc/nginx/ssl/trading_bot.crt;
    #     ssl_certificate_key /etc/nginx/ssl/trading_bot.key;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    #     ssl_prefer_server_ciphers off;
    #     
    #     # Security headers
    #     add_header Strict-Transport-Security "max-age=63072000" always;
    #     add_header X-Frame-Options DENY;
    #     add_header X-Content-Type-Options nosniff;
    #     add_header Referrer-Policy no-referrer-when-downgrade;
    #     
    #     # Same locations as HTTP server
    #     location / {
    #         return 301 https://$server_name/dashboard$request_uri;
    #     }
    #     
    #     location /api/ {
    #         # Same config as HTTP
    #     }
    #     
    #     # ... rest of config
    # }
    
    # Default server für undefined hosts
    server {
        listen 80 default_server;
        server_name _;
        return 444;  # Close connection without response
    }
}