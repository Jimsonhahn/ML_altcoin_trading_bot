version: '3.8'

services:
  # Trading Bot API
  trading_bot:
    build: .
    container_name: janics_trading_bot
    restart: always
    ports:
      - "8080:8080"
    environment:
      - ENV=production
      - FLASK_PORT=8080
      - FLASK_HOST=0.0.0.0
      - TRADING_MODE=${TRADING_MODE:-paper}
      - EXCHANGE_API_KEY=${EXCHANGE_API_KEY}
      - EXCHANGE_API_SECRET=${EXCHANGE_API_SECRET}
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - DATABASE_URL=sqlite:///data/trading_bot.db
    volumes:
      - ./data:/app/db
      - ./logs:/app/logs
      - ./config:/app/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: janics_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - trading_bot

  # PostgreSQL Database (optional, for production)
  postgres:
    image: postgres:15-alpine
    container_name: janics_postgres
    restart: always
    environment:
      - POSTGRES_DB=trading_bot
      - POSTGRES_USER=${DB_USER:-janics}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # Redis Cache (optional, for performance)
  redis:
    image: redis:7-alpine
    container_name: janics_redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}

  # Monitoring with Prometheus (optional)
  prometheus:
    image: prom/prometheus
    container_name: janics_prometheus
    restart: always
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  # Grafana for visualization (optional)
  grafana:
    image: grafana/grafana
    container_name: janics_grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  prometheus_data:
  grafana_data: